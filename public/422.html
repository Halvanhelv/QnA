<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Request rejected - Qna</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    :root { --canvas:#f2f4f8; --surface:#fff; --ink:#141b2d; --muted:#5b6579; --line:#dde2ec; --brand:#3347ff; --on-brand:#fff; }
    @media (prefers-color-scheme: dark) { :root { --canvas:#0d1120; --surface:#151b2d; --ink:#e6eaf5; --muted:#98a2b8; --line:#252d44; --brand:#8b98ff; --on-brand:#0d1120; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:1rem; background:var(--canvas); color:var(--ink); font:16px/1.6 "Figtree", system-ui, sans-serif; }
    main { width:100%; max-width:26rem; padding:2rem; border:1px solid var(--line); border-radius:.5rem; background:var(--surface); }
    .mark { display:grid; place-items:center; width:2rem; height:2rem; border-radius:.375rem; background:var(--brand); color:var(--on-brand); font-weight:700; }
    h1 { margin:1.25rem 0 .5rem; font:700 1.75rem/1.2 "Bricolage Grotesque", system-ui, sans-serif; letter-spacing:-.02em; }
    p { margin:0 0 1.5rem; color:var(--muted); }
    a { display:inline-block; padding:.5rem .875rem; border-radius:.375rem; background:var(--brand); color:var(--on-brand); font-weight:600; font-size:.875rem; text-decoration:none; }
    a:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">?</div>
    <h1>That change could not be saved</h1>
    <p>Your session may have expired. Reload the page and try again.</p>
    <a href="/">Back to questions</a>
  </main>
</body>
</html>
